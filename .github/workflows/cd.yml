name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Gate: Only deploy if CI succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail

            # Include pnpm and global node paths for user 'pry'
            export PATH="/home/pry/.local/share/pnpm/bin:/usr/local/bin:/usr/bin:$PATH"

            command -v node >/dev/null || { echo "::error::node not on PATH"; exit 1; }
            command -v pnpm >/dev/null || { echo "::error::pnpm not on PATH"; exit 1; }
            command -v pm2  >/dev/null || { echo "::error::pm2 not on PATH"; exit 1; }

            cd /opt/chai-learn
            git fetch --quiet origin main
            git reset --hard "$DEPLOY_SHA"

            # ---- Build & Migrate Backend ----
            pnpm --dir backend install --frozen-lockfile
            NODE_ENV=production pnpm --dir backend run db:migrate:prod

            # ---- Build Frontend ----
            pnpm --dir frontend install --frozen-lockfile
            pnpm --dir frontend run build

            # ---- Reload Services via PM2 directly as 'pry' ----
            pm2 reload backend
            pm2 reload frontend

            # ---- Health Check Verification ----
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:3000/api/health >/dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for backend to report healthy... ($i/10)"
              sleep 3
            done
            echo "::error::Health check failed after restart"
            exit 1
